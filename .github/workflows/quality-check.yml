name: Quality Check
# Run quality checks on book-formatter and generated books.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22, 24]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run tests
        run: npm test

      - name: Run build smoke check
        run: npm run build

      - name: Verify Node.js 24-compatible Actions
        run: npm run check:node24-actions
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.node-version }}
          path: |
            test-results/
            coverage/

  validate-templates:
    name: Validate Templates
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Validate template syntax
        run: |
          echo "🔍 Validating template files..."
          node --input-type=module -e "
          import { TemplateEngine } from './src/TemplateEngine.js';
          const engine = new TemplateEngine();
          const templates = engine.getAvailableTemplates();
          console.log('✅ Found ' + templates.length + ' templates');
          console.log('Templates:', templates.join(', '));
          "

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4

  book-generation-test:
    name: Book Generation Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Ruby (for Jekyll build)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Test book generation
        run: |
          echo "📚 Testing book generation..."
          
          # Create sample config
          npm start init -- --output test-config.json
          
          # Generate book
          npm start create-book -- --config test-config.json --output test-book
          
          # Validate generated structure
          echo "🔍 Validating generated book structure..."
          
          # Check required files
          for file in "index.md" "book-config.json" "_config.yml" "package.json"; do
            if [ -f "test-book/$file" ]; then
              echo "✅ Found: $file"
            else
              echo "❌ Missing: $file"
              exit 1
            fi
          done
          
          # Check directories
          for dir in "src" "assets" "templates" "scripts" "tests"; do
            if [ -d "test-book/$dir" ]; then
              echo "✅ Found directory: $dir"
            else
              echo "❌ Missing directory: $dir"
              exit 1
            fi
          done
          
          echo "✅ Book generation test passed!"
      
      - name: Test Jekyll build
        run: |
          cd test-book
          
          # Install Jekyll dependencies
          bundle init
          bundle add jekyll
          bundle add jekyll-feed
          bundle add jekyll-sitemap
          bundle add jekyll-seo-tag
          
          # Try to build with Jekyll
          bundle exec jekyll build || echo "⚠️  Jekyll build failed (expected without theme)"
      
      - name: Upload generated book
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-test-book
          path: test-book/

  markdown-quality:
    name: Markdown Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
      
      - name: Install markdownlint
        run: npm install -g markdownlint-cli
      
      - name: Run markdownlint
        run: |
          echo "📝 Checking markdown files..."
          markdownlint README.md || echo "⚠️  Some markdown issues found"

      - name: Run markdown structure check
        run: |
          echo "🧱 Checking markdown structure..."
          npm run check-markdown-structure -- . --fail-on error --output markdown-structure-report.json

      - name: Upload markdown structure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: markdown-structure-report
          path: markdown-structure-report.json

  web-mdbook-adapter:
    name: Web mdBook Adapter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install verified mdBook 0.5.4 binary
        env:
          MDBOOK_URL: https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook/bin"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/mdbook/mdbook.tar.gz" "$MDBOOK_URL"
          echo "$MDBOOK_SHA256  $RUNNER_TEMP/mdbook/mdbook.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/mdbook/mdbook.tar.gz" --directory "$RUNNER_TEMP/mdbook/bin"
          echo "$RUNNER_TEMP/mdbook/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mdbook/bin/mdbook" --version

      - name: Build standard sample with web-mdbook adapter
        run: |
          npm start build -- \
            --book examples/standard-book \
            --target web-mdbook \
            --edition free \
            --out-dir "$RUNNER_TEMP/book-formatter-output"
          mdbook build "$RUNNER_TEMP/book-formatter-output/web-mdbook"

      - name: Verify responsive geometry and edition visibility
        run: |
          npm run check-mdbook-responsive -- \
            --book "$RUNNER_TEMP/book-formatter-output/web-mdbook"
          npm run check-visibility -- \
            examples/standard-book \
            --edition free \
            --artifact "$RUNNER_TEMP/book-formatter-output/web-mdbook/book"

  summary:
    name: Quality Summary
    needs: [lint-and-test, validate-templates, security-scan, book-generation-test, markdown-quality, web-mdbook-adapter]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 📊 Quality Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check job statuses
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Add job status badges
          if [ "${{ needs.lint-and-test.result }}" = "success" ]; then
            echo "| Lint and Test | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Lint and Test | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.validate-templates.result }}" = "success" ]; then
            echo "| Template Validation | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Template Validation | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.security-scan.result }}" = "success" ]; then
            echo "| Security Scan | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Security Scan | ⚠️ Warning |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.book-generation-test.result }}" = "success" ]; then
            echo "| Book Generation | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Book Generation | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.markdown-quality.result }}" = "success" ]; then
            echo "| Markdown Quality | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Markdown Quality | ⚠️ Warning |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.web-mdbook-adapter.result }}" = "success" ]; then
            echo "| Web mdBook Adapter | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Web mdBook Adapter | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow**: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
