<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'ja' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    
    <!-- Optional consumer-owned icon: emit only files Jekyll will publish. -->
    {% assign shared_favicon_file = site.static_files | where: 'path', '/assets/favicon.ico' | first %}
    {% if shared_favicon_file %}
    <link rel="icon" type="image/x-icon" href="{{ '/assets/favicon.ico' | relative_url | escape }}">
    {% endif %}
</head>
<body>
    <div class="container">
        {{ content }}
    </div>
</body>
</html>
